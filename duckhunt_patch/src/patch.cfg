# Configuração do ld65: cada trecho do patch vira um .bin separado,
# montado no endereço exato da CPU onde vai entrar na ROM.
# O build.py converte cada um em um registro IPS (offset = endereço - $C000 + $10)
# e acrescenta o registro do cabeçalho (RAM extra com bateria).

MEMORY {
    # Pistola e flash
    M_D131: start = $D131, size = 3,    file = "build/p_D131.bin";
    M_D1C7: start = $D1C7, size = 6,    file = "build/p_D1C7.bin";
    # Menu
    M_C176: start = $C176, size = 3,    file = "build/p_C176.bin";
    M_C19E: start = $C19E, size = 1,    file = "build/p_C19E.bin";
    M_C1C0: start = $C1C0, size = 1,    file = "build/p_C1C0.bin";
    M_C1C7: start = $C1C7, size = 1,    file = "build/p_C1C7.bin";
    M_C1DF: start = $C1DF, size = 3,    file = "build/p_C1DF.bin";
    M_C5C8: start = $C5C8, size = 3,    file = "build/p_C5C8.bin";
    M_C82B: start = $C82B, size = 3,    file = "build/p_C82B.bin";
    # Rotinas novas: bloco de $FF em $EF5A-$F2FF (6 bytes de folga no início)
    M_NOVO: start = $EF60, size = $3A0, file = "build/p_NOVO.bin";
}

SEGMENTS {
    P_D131: load = M_D131, type = ro;
    P_D1C7: load = M_D1C7, type = ro;
    P_C176: load = M_C176, type = ro;
    P_C19E: load = M_C19E, type = ro;
    P_C1C0: load = M_C1C0, type = ro;
    P_C1C7: load = M_C1C7, type = ro;
    P_C1DF: load = M_C1DF, type = ro;
    P_C5C8: load = M_C5C8, type = ro;
    P_C82B: load = M_C82B, type = ro;
    NOVO:   load = M_NOVO, type = ro;
}
