# Configuração do ld65 para o patch V5 (protocolo 2: a pistola decide o acerto).
# Cada trecho vira um .bin separado, montado no endereço exato da CPU.
# O build.py (--protocolo 2) converte cada um em um registro IPS (offset = endereço - $C000 + $10).

MEMORY {
    M_C071: start = $C071, size = 3,    file = "build/p2_C071.bin";
    M_D131: start = $D131, size = 3,    file = "build/p2_D131.bin";
    M_D1C7: start = $D1C7, size = 6,    file = "build/p2_D1C7.bin";
    # Rotinas novas: bloco de $FF em $EF5A-$F2FF (6 bytes de folga no início)
    M_NOVO: start = $EF60, size = $3A0, file = "build/p2_NOVO.bin";
}

SEGMENTS {
    P_C071: load = M_C071, type = ro;
    P_D131: load = M_D131, type = ro;
    P_D1C7: load = M_D1C7, type = ro;
    NOVO:   load = M_NOVO, type = ro;
}
